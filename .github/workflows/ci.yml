# PR checks (§15.2): lint, vet, race tests on linux+macos with the whisper.cpp
# static build cached, plus one linux/amd64 build smoke. Full four-target
# builds are reserved for release.yml to keep PR feedback fast.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads the tree; no need to persist the token.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        # Install from source so it is built with the same (new) Go toolchain as
        # the module targets; prebuilt releases lag and refuse a newer go
        # directive ("built with go1.24 < targeted 1.26").
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run --timeout=5m ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads the tree; no need to persist the token.
          persist-credentials: false
          with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install cmake (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Cache whisper.cpp static build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/whisper.cpp/build
          key: whisper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.gitmodules', 'Makefile') }}-${{ hashFiles('third_party/whisper.cpp/CMakeLists.txt') }}
      - name: Build whisper.cpp (static)
        run: make whisper
      - name: Race tests (default build)
        run: go test -race ./...
      - name: Build smoke (whisper)
        run: make build && ./voxthief version
