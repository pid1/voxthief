# TEMPORARY — validates the windows cgo link fix without cutting a release.
# Delete before merging to main.
name: tmp windows build check

on:
  push:
    branches: [fix-windows-cgo-link]

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            make
          path-type: inherit
      - name: Build
        shell: msys2 {0}
        run: |
          make whisper
          echo "--- archives produced ---"
          ls -1 third_party/whisper.cpp/build/src/*.a third_party/whisper.cpp/build/ggml/src/*.a
          echo "--- linking ---"
          CGO_ENABLED=1 go build -tags whisper -o voxthief.exe ./cmd/voxthief
          ./voxthief.exe version
