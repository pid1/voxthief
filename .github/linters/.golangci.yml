---
linters:
  disable:
    # A large switch in a Bubble Tea Update function is the architecture
    # working as intended; splitting it would read worse.
    - gocyclo
linters-settings:
  errcheck:
    # "_ = f()" is the idiomatic way to say the error was considered and
    # discarded; flagging it defeats the point of writing it explicitly.
    check-blank: false
