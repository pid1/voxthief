# golangci-lint configuration (§13). Run: make lint
# Lints the default (non-cgo) build. The whisper.go cgo wrapper builds only with
# -tags whisper and needs the whisper.cpp static libs, so it is excluded here.
version: "2"

linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
  exclusions:
    rules:
      # Test cleanup (defer store.Close() etc.) does not need error checking.
      - path: _test\.go
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
