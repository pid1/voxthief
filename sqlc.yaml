version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/db/migrations"
    queries: "internal/db/queries.sql"
    gen:
      go:
        package: "gen"
        out: "internal/db/gen"
        emit_json_tags: false
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "REAL"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullFloat64"
